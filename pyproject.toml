[project]
name = "git-rebase-mcp"
version = "0.1.0"
description = "An MCP server that makes driving a git rebase safe for an agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2",
    # difflib's SequenceMatcher aligns badly on files with many similar blocks,
    # which is exactly what a test file looks like. Patience diff picks hunk
    # boundaries that match how the code was actually edited, and the hunk
    # boundaries are this server's core output.
    "patiencediff>=0.2",
]

[project.scripts]
git-rebase-mcp = "git_rebase_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_rebase_mcp"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--strict-markers"

[tool.pyright]
include = ["src", "test"]
strict = ["src"]
pythonVersion = "3.12"
